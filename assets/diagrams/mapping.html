<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<!-- 実践：研究プロセスの各フェーズに、AWS Quick の機能を割り当てる -->
<link rel="stylesheet" href="diagram.css">
<script src="wires.js"></script>
<style>
  #fig { width: 1200px; height: 470px; }
  .band { position: absolute; left: 0; width: 1200px; height: 56px; display: flex; align-items: center; gap: 16px; padding: 0 18px; font-size: 19px; }
  .band b { font-family: var(--font-head); font-weight: 900; font-size: 24px; }
  .band small { color: var(--grey); font-size: 16px; font-weight: 700; }
  .band.top { top: 0; border: 2px solid var(--ink); background: #fff; }
  .band.bot { top: 400px; border: 3px solid var(--hot); background: #fff; }
  .band.bot b { color: var(--hot); }
  .stg { position: absolute; top: 90px; width: 216px; height: 64px; background: var(--ink); color: #fff; text-align: center;
    font-family: var(--font-body); font-weight: 900; font-size: 26px; line-height: 64px; letter-spacing: .04em; }
  .fn { position: absolute; top: 176px; width: 216px; height: 64px; border: 2px solid var(--ink); background: var(--bone); text-align: center;
    display: flex; align-items: center; justify-content: center; font-size: 19px; font-weight: 900; line-height: 1.3; }
  .tool { position: absolute; top: 258px; width: 216px; text-align: center; font-size: 16px; color: var(--grey); font-weight: 700; line-height: 1.4; }
  .out { position: absolute; top: 318px; width: 216px; text-align: center; font-size: 17px; line-height: 1.4; }
  .rowlbl { position: absolute; left: -8px; font-size: 14px; color: var(--grey); font-weight: 800; }
</style>
</head><body>
<div id="fig">
  <svg id="wires"></svg>
  <div class="band top"><b>Space</b><span>研究室の資料をまとめて保存する</span><small>手順書・文献レビュー・基準の要約・センサーデータ</small></div>

  <div class="stg" style="left:0">課題設定</div>
  <div class="stg" style="left:246px">文献調査</div>
  <div class="stg" style="left:492px">研究計画</div>
  <div class="stg" style="left:738px">データ分析</div>
  <div class="stg" style="left:984px">成果発信</div>

  <div class="fn" style="left:0">チャット<br>エージェント</div>
  <div class="fn" style="left:246px">チャット<br>エージェント</div>
  <div class="fn" style="left:492px">チャット<br>エージェント</div>
  <div class="fn" style="left:738px">コード実行</div>
  <div class="fn" style="left:984px">チャット<br>エージェント</div>

  <div class="tool" style="left:0">資料の検索</div>
  <div class="tool" style="left:246px">Web 検索・資料の検索</div>
  <div class="tool" style="left:492px">Web 検索で様式を確認</div>
  <div class="tool" style="left:738px">Python で集計</div>
  <div class="tool" style="left:984px">読み手に合わせた書き分け</div>

  <div class="out" style="left:0">問いの候補と採点</div>
  <div class="out" style="left:246px">出典つきの要約</div>
  <div class="out" style="left:492px">研究計画と<br>DMP の下書き</div>
  <div class="out" style="left:738px">集計表と仮説の確認</div>
  <div class="out" style="left:984px">要旨と<br>やさしい説明</div>

  <div class="band bot"><b>Flows</b><span>5 つのフェーズを 1 本のフローにつなぎ、研究テーマの入力だけで一巡させる</span></div>
</div>
<script>
window.addEventListener('load', async () => { await document.fonts.ready; document.body.dataset.ready = '1'; });
</script>
</body></html>
