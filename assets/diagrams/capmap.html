<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<!-- Quick：AI に求められる 4 つの能力と、それを満たす AWS Quick の機能 -->
<link rel="stylesheet" href="diagram.css">
<script src="wires.js"></script>
<style>
  #fig { width: 1200px; height: 420px; }
  .cap, .fn { position: absolute; height: 84px; display: flex; flex-direction: column; justify-content: center; padding: 0 20px; }
  .cap { left: 0; width: 400px; border: 2px solid var(--ink); background: #fff; font-size: 21px; font-weight: 900; }
  .fn { left: 560px; width: 640px; border: 2px solid var(--ink); background: var(--ink); color: #fff; font-size: 22px; font-weight: 900; }
  .fn small { font-size: 16px; font-weight: 700; color: #d6d1c4; margin-top: 2px; }
  .hd { position: absolute; top: 0; font-size: 16px; font-weight: 800; color: var(--grey); }
</style>
</head><body>
<div id="fig">
  <svg id="wires"></svg>
  <div class="hd" style="left:0">AI に求められる能力</div>
  <div class="hd" style="left:560px">AWS Quick の機能</div>
  <div class="cap" id="c1" style="top:34px">研究室の資料を参照する</div>
  <div class="cap" id="c2" style="top:130px">Web の最新情報を調べる</div>
  <div class="cap" id="c3" style="top:226px">データを正確に計算する</div>
  <div class="cap" id="c4" style="top:322px">手順をつなげて繰り返す</div>
  <div class="fn" id="f1" style="top:34px">Space ＋ チャットエージェント<small>資料をまとめ、指示どおりに資料を検索して答える</small></div>
  <div class="fn" id="f2" style="top:130px">Research と Web 検索<small>複数の調査を並行し、出典つきの報告書にまとめる</small></div>
  <div class="fn" id="f3" style="top:226px">コード実行<small>Python のコードを書いて実行し、コードを成果物として残す</small></div>
  <div class="fn" id="f4" style="top:322px">Flows<small>エージェントと決まった処理をステップとしてつなぐ</small></div>
</div>
<script>
window.addEventListener('load', async () => { await document.fonts.ready;
  for (const n of [1,2,3,4]) wire('#c'+n, '#f'+n);
  document.body.dataset.ready = '1';
});
</script>
</body></html>
